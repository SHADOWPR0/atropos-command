name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the command protocol
        run: python3 skills/atropos-command/scripts/validate_skill.py
